name: CI

on:
  push:
    branches: [main, tnandy/mvp1]
  pull_request:
    branches: [main, tnandy/mvp1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Generator snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # First pass: regenerate snapshots (creates missing ones, updates stale ones).
      # Second pass: assert nothing changed — if something differs the commit is the source of truth.
      - name: Regenerate snapshots
        run: UPDATE_SNAPSHOTS=1 npm test
      - name: Assert no snapshot drift
        run: |
          git diff --exit-code src/lib/generators/__tests__/__snapshots__/ || \
          (echo "Snapshot drift detected. Run 'UPDATE_SNAPSHOTS=1 npm test' locally on Node 22 and commit the updated snapshots." && exit 1)

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  smoke-build:
    name: Smoke build (${{ matrix.combo.label }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        combo:
          - { label: "go-gin", language: "go", framework: "gin", goVersion: "1.23" }
          - { label: "ts-express", language: "typescript", framework: "express" }
          - { label: "python-fastapi", language: "python", framework: "fastapi" }
          - { label: "rust-axum", language: "rust", framework: "axum" }
          - { label: "java-spring", language: "java", framework: "spring", javaVersion: "21" }
          - { label: "java-quarkus", language: "java", framework: "quarkus", javaVersion: "21" }
          - { label: "kotlin-ktor", language: "kotlin", framework: "ktor", javaVersion: "21", runTests: true }
          - { label: "kotlin-spring-kt", language: "kotlin", framework: "spring-kt", javaVersion: "21" }
          # "full" profile: every flag on (tracing, rateLimit, audit, auth, k8s/helm) + an entity,
          # across frameworks and databases, so the code behind those options is actually compiled.
          - { label: "go-gin-full-mysql", language: "go", framework: "gin", profile: "full", database: "mysql" }
          - { label: "go-fiber-full-mongodb", language: "go", framework: "fiber", profile: "full", database: "mongodb" }
          - { label: "go-echo-full", language: "go", framework: "echo", profile: "full" }
          - { label: "go-chi-full", language: "go", framework: "chi", profile: "full" }
          - { label: "ts-express-full", language: "typescript", framework: "express", profile: "full" }
          - { label: "ts-nestjs-full", language: "typescript", framework: "nestjs", profile: "full" }
          - { label: "ts-fastify-full", language: "typescript", framework: "fastify", profile: "full" }
          - { label: "ts-hono-full", language: "typescript", framework: "hono", profile: "full" }
          - { label: "python-fastapi-full-mysql", language: "python", framework: "fastapi", profile: "full", database: "mysql" }
          - { label: "python-litestar-full", language: "python", framework: "litestar", profile: "full" }
          - { label: "python-django-full", language: "python", framework: "django", profile: "full" }
          - { label: "rust-axum-full-mysql", language: "rust", framework: "axum", profile: "full", database: "mysql" }
          - { label: "rust-actix-full", language: "rust", framework: "actix", profile: "full" }
          - { label: "java-spring-full-mysql", language: "java", framework: "spring", profile: "full", database: "mysql", javaVersion: "21" }
          - { label: "java-quarkus-full", language: "java", framework: "quarkus", profile: "full", javaVersion: "21" }
          - { label: "kotlin-ktor-full", language: "kotlin", framework: "ktor", profile: "full", javaVersion: "21", runTests: true }
          - { label: "kotlin-spring-kt-full", language: "kotlin", framework: "spring-kt", profile: "full", javaVersion: "21" }
          # Self-issued auth (auth: none + auth_* patterns → HS256 JWT_SECRET) is a separate code path.
          - { label: "go-gin-full-selfauth", language: "go", framework: "gin", profile: "full", auth: "none" }
          - { label: "ts-nestjs-full-selfauth", language: "typescript", framework: "nestjs", profile: "full", auth: "none" }
          - { label: "python-fastapi-full-selfauth", language: "python", framework: "fastapi", profile: "full", auth: "none" }
          # Non-REST API modes (codegen: buf for Go gRPC, gqlgen for Go GraphQL, grpc_tools for Python gRPC).
          - { label: "go-gin-grpc-full", language: "go", framework: "gin", profile: "full", api: "grpc" }
          - { label: "go-chi-graphql", language: "go", framework: "chi", api: "graphql" }
          - { label: "go-chi-graphql-full", language: "go", framework: "chi", profile: "full", api: "graphql" }
          - { label: "ts-express-graphql-full", language: "typescript", framework: "express", profile: "full", api: "graphql" }
          - { label: "ts-express-trpc-full", language: "typescript", framework: "express", profile: "full", api: "trpc" }
          - { label: "ts-fastify-grpc-full", language: "typescript", framework: "fastify", profile: "full", api: "grpc" }
          - { label: "python-fastapi-graphql-full", language: "python", framework: "fastapi", profile: "full", api: "graphql" }
          - { label: "python-fastapi-grpc-full", language: "python", framework: "fastapi", profile: "full", api: "grpc" }
          - { label: "ts-fastify-trpc-full", language: "typescript", framework: "fastify", profile: "full", api: "trpc" }
          - { label: "ts-hono-trpc-full", language: "typescript", framework: "hono", profile: "full", api: "trpc" }
          - { label: "ts-nestjs-trpc-full", language: "typescript", framework: "nestjs", profile: "full", api: "trpc" }
          - { label: "ts-express-full-selfauth", language: "typescript", framework: "express", profile: "full", auth: "none" }
          - { label: "ts-fastify-full-selfauth", language: "typescript", framework: "fastify", profile: "full", auth: "none" }
          - { label: "ts-hono-full-selfauth", language: "typescript", framework: "hono", profile: "full", auth: "none" }
          - { label: "python-litestar-full-selfauth", language: "python", framework: "litestar", profile: "full", auth: "none" }
          - { label: "python-django-full-selfauth", language: "python", framework: "django", profile: "full", auth: "none" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Generate repo
        env:
          LANGUAGE: ${{ matrix.combo.language }}
          FRAMEWORK: ${{ matrix.combo.framework }}
          PROFILE: ${{ matrix.combo.profile || 'minimal' }}
          DATABASE: ${{ matrix.combo.database || 'postgres' }}
          AUTH: ${{ matrix.combo.auth || '' }}
          API: ${{ matrix.combo.api || 'rest' }}
        run: |
          node --experimental-strip-types --no-warnings \
            --import ./src/lib/generators/__tests__/loader.mjs \
            scripts/smoke-generate.mjs

      - name: Setup Go
        if: matrix.combo.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.combo.goVersion || '1.23' }}

      - name: Smoke build (Go)
        if: matrix.combo.language == 'go'
        working-directory: /tmp/smoke-repo
        run: |
          # Same codegen the generated Dockerfile / Makefile runs (gen/go and graph/ aren't in the zip).
          {
            if [ -f buf.gen.yaml ]; then go run github.com/bufbuild/buf/cmd/buf@v1.47.2 generate; fi &&
            go mod tidy &&
            if [ -f gqlgen.yml ]; then go run github.com/99designs/gqlgen generate && go mod tidy; fi &&
            go build ./... && go vet ./...
          } 2>&1 | tee -a /tmp/smoke.log
          test -z "$(gofmt -l .)" || { echo "::error::generated Go is not gofmt-clean:"; gofmt -l .; exit 1; }

      - name: Setup Node (TS)
        if: matrix.combo.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke build (TypeScript)
        if: matrix.combo.language == 'typescript'
        working-directory: /tmp/smoke-repo
        run: |
          { npm install --no-audit --no-fund && npx tsc --noEmit --skipLibCheck; } 2>&1 | tee -a /tmp/smoke.log

      - name: Setup Python
        if: matrix.combo.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke build (Python)
        if: matrix.combo.language == 'python'
        working-directory: /tmp/smoke-repo
        run: |
          # Generated Python repos use Poetry (pyproject.toml), same as their Dockerfile.
          {
            pip install -q poetry==1.8.3 &&
            poetry config virtualenvs.create false &&
            poetry install --no-root &&
            if [ -d proto ]; then
              mkdir -p gen/python &&
              python -m grpc_tools.protoc -I proto --python_out=gen/python --pyi_out=gen/python --grpc_python_out=gen/python proto/*/v1/*.proto
            fi &&
            python -m py_compile $(find . -name "*.py" -not -path "./.venv/*") &&
            pip install -q pyflakes &&
            # Only undefined names fail the build: they are runtime NameErrors. Other pyflakes output is style.
            { python -m pyflakes . > /tmp/pyflakes.txt || true; } &&
            ! grep "undefined name" /tmp/pyflakes.txt
          } 2>&1 | tee -a /tmp/smoke.log

      - name: Setup Java
        if: matrix.combo.language == 'java' || matrix.combo.language == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.combo.javaVersion || '21' }}

      - name: Smoke build (Java/Kotlin – Maven)
        if: matrix.combo.language == 'java'
        working-directory: /tmp/smoke-repo
        run: |
          if [ -x ./mvnw ]; then MVN=./mvnw; else MVN=mvn; fi
          $MVN -B compile -q 2>&1 | tee -a /tmp/smoke.log

      - name: Smoke build (Kotlin – Gradle)
        if: matrix.combo.language == 'kotlin'
        working-directory: /tmp/smoke-repo
        run: |
          gradle --version | grep -E "^Gradle"
          if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=gradle; fi
          $GRADLE compileKotlin -q 2>&1 | tee -a /tmp/smoke.log
          # Ktor: generated tests must pass with no external services (in-memory DB, test-signed JWTs).
          if [ "${{ matrix.combo.runTests }}" = "true" ]; then $GRADLE test 2>&1 | tee -a /tmp/smoke.log; fi

      - name: Setup Rust
        if: matrix.combo.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Smoke build (Rust)
        if: matrix.combo.language == 'rust'
        working-directory: /tmp/smoke-repo
        run: cargo check 2>&1 | tee -a /tmp/smoke.log

      - name: Report smoke errors
        if: failure()
        run: |
          # CI logs aren't always downloadable; surface the compiler errors as annotations.
          grep -E "error|\.go:[0-9]+:[0-9]+:|^e: |\[ERROR\]|What went wrong|undefined name| FAILED$" /tmp/smoke.log 2>/dev/null \
            | grep -vE "^npm warn|0 errors" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
