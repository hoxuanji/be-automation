name: CI

on:
  push:
    branches: [main, tnandy/mvp1]
  pull_request:
    branches: [main, tnandy/mvp1]

# Explicit bash = `bash --noprofile --norc -eo pipefail`. Without it GitHub runs `bash -e`
# (no pipefail), and every `cmd | tee -a /tmp/smoke.log` step reports tee's exit status,
# so compile/test failures show green.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Generator snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # First pass: regenerate snapshots (creates missing ones, updates stale ones).
      # Second pass: assert nothing changed — if something differs the commit is the source of truth.
      - name: Cloud deploy pipeline tests
        run: npm run test:deploy
      - name: Regenerate snapshots
        run: UPDATE_SNAPSHOTS=1 npm test
      - name: Assert no snapshot drift
        run: |
          git diff --exit-code src/lib/generators/__tests__/__snapshots__/ || \
          (echo "Snapshot drift detected. Run 'UPDATE_SNAPSHOTS=1 npm test' locally on Node 22 and commit the updated snapshots." && exit 1)

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Swagger UI's apidom namespaces attach `.refract` in refractor/registration.mjs side-effect
      # modules; Turbopack drops them ("refract is not a function" on /api-builder). Fail if missing.
      - name: Check Swagger UI apidom registration is bundled
        run: |
          grep -rqF '"objects","Callback","$visitor"' .next/static \
            || { echo "::error::apidom refractor registration missing from client bundle (Swagger UI will break)"; exit 1; }

  smoke-build:
    name: Smoke build (${{ matrix.combo.label }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        combo:
          - { label: "go-gin", language: "go", framework: "gin", goVersion: "1.23" }
          - { label: "ts-express", language: "typescript", framework: "express" }
          - { label: "python-fastapi", language: "python", framework: "fastapi" }
          - { label: "rust-axum", language: "rust", framework: "axum" }
          - { label: "java-spring", language: "java", framework: "spring", javaVersion: "21" }
          - { label: "java-quarkus", language: "java", framework: "quarkus", javaVersion: "21" }
          - { label: "kotlin-ktor", language: "kotlin", framework: "ktor", javaVersion: "21", runTests: true }
          - { label: "kotlin-spring-kt", language: "kotlin", framework: "spring-kt", javaVersion: "21", runTests: true }
          # "full" profile: every flag on (tracing, rateLimit, audit, auth, k8s/helm) + an entity,
          # across frameworks and databases, so the code behind those options is actually compiled.
          - { label: "go-gin-full-mysql", language: "go", framework: "gin", profile: "full", database: "mysql" }
          - { label: "go-fiber-full-mongodb", language: "go", framework: "fiber", profile: "full", database: "mongodb" }
          - { label: "go-echo-full", language: "go", framework: "echo", profile: "full" }
          - { label: "go-chi-full", language: "go", framework: "chi", profile: "full" }
          - { label: "ts-express-full", language: "typescript", framework: "express", profile: "full" }
          - { label: "ts-nestjs-full", language: "typescript", framework: "nestjs", profile: "full" }
          - { label: "ts-fastify-full", language: "typescript", framework: "fastify", profile: "full" }
          - { label: "ts-hono-full", language: "typescript", framework: "hono", profile: "full" }
          - { label: "python-fastapi-full-mysql", language: "python", framework: "fastapi", profile: "full", database: "mysql" }
          - { label: "python-litestar-full", language: "python", framework: "litestar", profile: "full" }
          - { label: "python-django-full", language: "python", framework: "django", profile: "full" }
          - { label: "rust-axum-full-mysql", language: "rust", framework: "axum", profile: "full", database: "mysql" }
          - { label: "rust-actix-full", language: "rust", framework: "actix", profile: "full" }
          - { label: "java-spring-full-mysql", language: "java", framework: "spring", profile: "full", database: "mysql", javaVersion: "21" }
          - { label: "java-quarkus-full", language: "java", framework: "quarkus", profile: "full", javaVersion: "21" }
          - { label: "kotlin-ktor-full", language: "kotlin", framework: "ktor", profile: "full", javaVersion: "21", runTests: true }
          - { label: "kotlin-spring-kt-full", language: "kotlin", framework: "spring-kt", profile: "full", javaVersion: "21", runTests: true }
          # Self-issued auth (auth: none + auth_* patterns → HS256 JWT_SECRET) is a separate code path.
          - { label: "go-gin-full-selfauth", language: "go", framework: "gin", profile: "full", auth: "none" }
          - { label: "ts-nestjs-full-selfauth", language: "typescript", framework: "nestjs", profile: "full", auth: "none" }
          - { label: "python-fastapi-full-selfauth", language: "python", framework: "fastapi", profile: "full", auth: "none" }
          # Non-REST API modes (codegen: buf for Go gRPC, gqlgen for Go GraphQL, grpc_tools for Python gRPC).
          - { label: "go-gin-grpc-full", language: "go", framework: "gin", profile: "full", api: "grpc" }
          - { label: "go-chi-graphql", language: "go", framework: "chi", api: "graphql" }
          - { label: "go-chi-graphql-full", language: "go", framework: "chi", profile: "full", api: "graphql" }
          - { label: "ts-express-graphql-full", language: "typescript", framework: "express", profile: "full", api: "graphql" }
          - { label: "ts-express-trpc-full", language: "typescript", framework: "express", profile: "full", api: "trpc" }
          - { label: "ts-fastify-grpc-full", language: "typescript", framework: "fastify", profile: "full", api: "grpc" }
          - { label: "python-fastapi-graphql-full", language: "python", framework: "fastapi", profile: "full", api: "graphql" }
          - { label: "python-fastapi-grpc-full", language: "python", framework: "fastapi", profile: "full", api: "grpc" }
          - { label: "ts-fastify-trpc-full", language: "typescript", framework: "fastify", profile: "full", api: "trpc" }
          - { label: "ts-hono-trpc-full", language: "typescript", framework: "hono", profile: "full", api: "trpc" }
          - { label: "ts-nestjs-trpc-full", language: "typescript", framework: "nestjs", profile: "full", api: "trpc" }
          - { label: "ts-express-full-selfauth", language: "typescript", framework: "express", profile: "full", auth: "none" }
          - { label: "ts-fastify-full-selfauth", language: "typescript", framework: "fastify", profile: "full", auth: "none" }
          - { label: "ts-hono-full-selfauth", language: "typescript", framework: "hono", profile: "full", auth: "none" }
          - { label: "python-litestar-full-selfauth", language: "python", framework: "litestar", profile: "full", auth: "none" }
          - { label: "python-django-full-selfauth", language: "python", framework: "django", profile: "full", auth: "none" }
          # Every queue option per language (rabbitmq is covered by the full profile above).
          - { label: "go-gin-full-kafka", language: "go", framework: "gin", profile: "full", queue: "kafka" }
          - { label: "ts-express-full-kafka", language: "typescript", framework: "express", profile: "full", queue: "kafka" }
          - { label: "python-fastapi-full-kafka", language: "python", framework: "fastapi", profile: "full", queue: "kafka" }
          - { label: "rust-axum-full-kafka", language: "rust", framework: "axum", profile: "full", queue: "kafka" }
          - { label: "java-spring-full-kafka", language: "java", framework: "spring", profile: "full", queue: "kafka", javaVersion: "21" }
          - { label: "kotlin-ktor-full-kafka", language: "kotlin", framework: "ktor", profile: "full", queue: "kafka", javaVersion: "21", runTests: true }
          - { label: "go-gin-full-sqs", language: "go", framework: "gin", profile: "full", queue: "sqs" }
          - { label: "ts-express-full-sqs", language: "typescript", framework: "express", profile: "full", queue: "sqs" }
          - { label: "python-fastapi-full-sqs", language: "python", framework: "fastapi", profile: "full", queue: "sqs" }
          - { label: "rust-axum-full-sqs", language: "rust", framework: "axum", profile: "full", queue: "sqs" }
          - { label: "java-spring-full-sqs", language: "java", framework: "spring", profile: "full", queue: "sqs", javaVersion: "21" }
          - { label: "kotlin-ktor-full-sqs", language: "kotlin", framework: "ktor", profile: "full", queue: "sqs", javaVersion: "21", runTests: true }
          - { label: "go-gin-full-nats", language: "go", framework: "gin", profile: "full", queue: "nats" }
          - { label: "ts-express-full-nats", language: "typescript", framework: "express", profile: "full", queue: "nats" }
          - { label: "python-fastapi-full-nats", language: "python", framework: "fastapi", profile: "full", queue: "nats" }
          - { label: "rust-axum-full-nats", language: "rust", framework: "axum", profile: "full", queue: "nats" }
          - { label: "java-spring-full-nats", language: "java", framework: "spring", profile: "full", queue: "nats", javaVersion: "21" }
          - { label: "kotlin-ktor-full-nats", language: "kotlin", framework: "ktor", profile: "full", queue: "nats", javaVersion: "21", runTests: true }
          - { label: "go-gin-full-bullmq", language: "go", framework: "gin", profile: "full", queue: "bullmq" }
          - { label: "ts-express-full-bullmq", language: "typescript", framework: "express", profile: "full", queue: "bullmq" }
          - { label: "python-fastapi-full-bullmq", language: "python", framework: "fastapi", profile: "full", queue: "bullmq" }
          - { label: "rust-axum-full-bullmq", language: "rust", framework: "axum", profile: "full", queue: "bullmq" }
          - { label: "java-spring-full-bullmq", language: "java", framework: "spring", profile: "full", queue: "bullmq", javaVersion: "21" }
          - { label: "kotlin-ktor-full-bullmq", language: "kotlin", framework: "ktor", profile: "full", queue: "bullmq", javaVersion: "21", runTests: true }
          - { label: "java-quarkus-full-kafka", language: "java", framework: "quarkus", profile: "full", queue: "kafka", javaVersion: "21" }
          - { label: "kotlin-spring-kt-full-kafka", language: "kotlin", framework: "spring-kt", profile: "full", queue: "kafka", javaVersion: "21", runTests: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Generate repo
        env:
          LANGUAGE: ${{ matrix.combo.language }}
          FRAMEWORK: ${{ matrix.combo.framework }}
          PROFILE: ${{ matrix.combo.profile || 'minimal' }}
          DATABASE: ${{ matrix.combo.database || 'postgres' }}
          AUTH: ${{ matrix.combo.auth || '' }}
          API: ${{ matrix.combo.api || 'rest' }}
          QUEUE: ${{ matrix.combo.queue || 'rabbitmq' }}
        run: |
          node --experimental-strip-types --no-warnings \
            --import ./src/lib/generators/__tests__/loader.mjs \
            scripts/smoke-generate.mjs

      - name: Setup Go
        if: matrix.combo.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.combo.goVersion || '1.23' }}

      - name: Smoke build (Go)
        if: matrix.combo.language == 'go'
        working-directory: /tmp/smoke-repo
        run: |
          # Same codegen the generated Dockerfile / Makefile runs (gen/go and graph/ aren't in the zip).
          {
            if [ -f buf.gen.yaml ]; then go run github.com/bufbuild/buf/cmd/buf@v1.47.2 generate; fi &&
            go mod tidy &&
            if [ -f gqlgen.yml ]; then go run github.com/99designs/gqlgen generate && go mod tidy; fi &&
            go build ./... && go vet ./...
          } 2>&1 | tee -a /tmp/smoke.log
          test -z "$(gofmt -l .)" || { echo "::error::generated Go is not gofmt-clean:"; gofmt -l .; exit 1; }

      - name: Setup Node (TS)
        if: matrix.combo.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke build (TypeScript)
        if: matrix.combo.language == 'typescript'
        working-directory: /tmp/smoke-repo
        run: |
          { npm install --no-audit --no-fund && npx tsc --noEmit --skipLibCheck; } 2>&1 | tee -a /tmp/smoke.log

      - name: Setup Python
        if: matrix.combo.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke build (Python)
        if: matrix.combo.language == 'python'
        working-directory: /tmp/smoke-repo
        run: |
          # Generated Python repos use Poetry (pyproject.toml), same as their Dockerfile.
          {
            pip install -q poetry==1.8.3 &&
            poetry config virtualenvs.create false &&
            poetry install --no-root &&
            if [ -d proto ]; then
              mkdir -p gen/python &&
              python -m grpc_tools.protoc -I proto --python_out=gen/python --pyi_out=gen/python --grpc_python_out=gen/python proto/*/v1/*.proto
            fi &&
            python -m py_compile $(find . -name "*.py" -not -path "./.venv/*") &&
            pip install -q pyflakes &&
            # Only undefined names fail the build: they are runtime NameErrors. Other pyflakes output is style.
            { python -m pyflakes . > /tmp/pyflakes.txt || true; } &&
            ! grep "undefined name" /tmp/pyflakes.txt
          } 2>&1 | tee -a /tmp/smoke.log

      - name: Setup Java
        if: matrix.combo.language == 'java' || matrix.combo.language == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.combo.javaVersion || '21' }}

      - name: Smoke build (Java/Kotlin – Maven)
        if: matrix.combo.language == 'java'
        working-directory: /tmp/smoke-repo
        run: |
          if [ -x ./mvnw ]; then MVN=./mvnw; else MVN=mvn; fi
          # Java: generated tests must pass with no external services (H2 test profile, fakes).
          $MVN -B test -q 2>&1 | tee -a /tmp/smoke.log

      - name: Smoke build (Kotlin – Gradle)
        if: matrix.combo.language == 'kotlin'
        working-directory: /tmp/smoke-repo
        run: |
          gradle --version | grep -E "^Gradle"
          if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=gradle; fi
          $GRADLE compileKotlin -q 2>&1 | tee -a /tmp/smoke.log
          # Kotlin: generated tests must pass with no external services (in-memory DB, test-signed JWTs).
          if [ "${{ matrix.combo.runTests }}" = "true" ]; then $GRADLE test 2>&1 | tee -a /tmp/smoke.log; fi

      - name: Setup Rust
        if: matrix.combo.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Smoke build (Rust)
        if: matrix.combo.language == 'rust'
        working-directory: /tmp/smoke-repo
        env:
          CARGO_TERM_COLOR: never
        run: cargo check 2>&1 | tee -a /tmp/smoke.log

      - name: Report smoke errors
        if: failure()
        run: |
          # CI logs aren't always downloadable; surface the real errors as annotations.
          # Compiler errors first (Go, Rust, TS, Maven/javac, Kotlin), then failing tests from JUnit/surefire reports.
          sed -E 's/\x1b\[[0-9;]*m//g' /tmp/smoke.log 2>/dev/null > /tmp/smoke.clean.log || true
          grep -E '\.go:[0-9]+:[0-9]+:|^error(\[E[0-9]+\])?:|^ *--> |error TS[0-9]+|\[ERROR\] .*\.(java|kt)|COMPILATION ERROR|^e: |What went wrong|undefined name|missing go.sum|Could not resolve|Cannot resolve|CMake Error|failed to run custom build command|Tests run:.*Failures: [1-9]|Caused by: ' /tmp/smoke.clean.log 2>/dev/null \
            | grep -vE '^\s*(Compiling|Checking|Downloaded|Downloading)' | head -30 | while IFS= read -r l; do echo "::error::$l"; done
          # Cargo build-script failures print the real cause under "--- stderr".
          grep -A400 -- '--- stderr' /tmp/smoke.clean.log 2>/dev/null \
            | grep -iE 'error|fatal|could not find|not found|no such file|undefined reference' | grep -viE 'deprecation' \
            | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          find /tmp/smoke-repo \( -path '*test-results*' -o -path '*surefire-reports*' \) -name '*.xml' 2>/dev/null \
            | xargs -r grep -hoE '<testcase [^>]*name="[^"]*"|<(failure|error) [^>]*message="[^"]{0,300}' | grep -B1 -E '<(failure|error)' | head -20 \
            | while IFS= read -r l; do echo "::error::$l"; done

  e2e:
    name: E2E (${{ matrix.combo.label }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        # One full-profile stack per language, each with a different broker: the image must
        # build, the api must report ready (DB + cache + broker reachable), the worker must stay up.
        combo:
          - { label: "go-gin-rabbitmq", language: "go", framework: "gin", queue: "rabbitmq" }
          - { label: "ts-express-kafka", language: "typescript", framework: "express", queue: "kafka" }
          - { label: "python-fastapi-nats", language: "python", framework: "fastapi", queue: "nats" }
          - { label: "rust-axum-sqs", language: "rust", framework: "axum", queue: "sqs" }
          - { label: "java-spring-rabbitmq", language: "java", framework: "spring", queue: "rabbitmq" }
          - { label: "kotlin-ktor-bullmq", language: "kotlin", framework: "ktor", queue: "bullmq" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate repo
        env:
          LANGUAGE: ${{ matrix.combo.language }}
          FRAMEWORK: ${{ matrix.combo.framework }}
          PROFILE: full
          AUTH: none
          QUEUE: ${{ matrix.combo.queue }}
          DEPLOYMENT: k8s
        run: |
          node --experimental-strip-types --no-warnings \
            --import ./src/lib/generators/__tests__/loader.mjs \
            scripts/smoke-generate.mjs
      - name: docker compose up
        working-directory: /tmp/smoke-repo
        run: |
          cp .env.example .env
          docker compose up -d --build 2>&1 | tee /tmp/compose.log
      - name: API becomes ready and the worker stays up
        working-directory: /tmp/smoke-repo
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' 'http://localhost:8080/health?ready=1' || true)
            [ "$code" = "200" ] && { echo "ready after ${i}x2s"; cat /tmp/ready.json; break; }
            sleep 2
          done
          [ "$code" = "200" ] || { echo "::error::api never became ready (last status $code): $(cat /tmp/ready.json 2>/dev/null)"; exit 1; }
          if docker compose config --services | grep -qx worker; then
            sleep 10
            state=$(docker compose ps worker --format '{{.State}}')
            [ "$state" = "running" ] || { echo "::error::worker is $state"; exit 1; }
          fi
      - name: Report e2e errors
        if: failure()
        working-directory: /tmp/smoke-repo
        run: |
          docker compose ps -a || true
          for svc in api worker; do
            docker compose logs --no-color --tail 40 "$svc" 2>/dev/null | grep -iE 'error|panic|exception|fatal|refused|failed' | head -10 \
              | while IFS= read -r l; do echo "::error::$svc: $l"; done
          done
          grep -iE 'error|failed' /tmp/compose.log | head -15 | while IFS= read -r l; do echo "::error::build: $l"; done
